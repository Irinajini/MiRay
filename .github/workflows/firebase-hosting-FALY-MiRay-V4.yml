name: Build & Deploy FALY MiRay

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Find FALY MiRay project folder
        id: project
        shell: bash
        run: |
          set -e

          if [ -f "package.json" ]; then
            PROJECT_DIR="."
          else
            PACKAGE_FILE="$(find . -maxdepth 4 -type f -name package.json \
              ! -path '*/node_modules/*' \
              ! -path '*/.git/*' \
              | head -n 1)"

            if [ -z "$PACKAGE_FILE" ]; then
              echo "::error::Aucun package.json trouvé dans le dépôt (profondeur max 4)."
              echo "Contenu de la racine :"
              ls -la
              exit 1
            fi

            PROJECT_DIR="$(dirname "$PACKAGE_FILE")"
          fi

          echo "Projet détecté dans : $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          test -f "$PROJECT_DIR/firebase.json" || {
            echo "::error::firebase.json absent dans $PROJECT_DIR"
            exit 1
          }

          test -f "$PROJECT_DIR/src/main.jsx" || {
            echo "::error::src/main.jsx absent dans $PROJECT_DIR"
            exit 1
          }

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm install --no-audit --no-fund

      - name: Build Vite application
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm run build

      - name: Verify build output
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.dir }}"
          test -f "$PROJECT_DIR/dist/index.html" || {
            echo "::error::Le build n'a pas créé $PROJECT_DIR/dist/index.html"
            exit 1
          }

      - name: Check Firebase service account secret
        shell: bash
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FALY_MIRAY }}
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT_FALY_MIRAY manquant."
            echo "GitHub > Settings > Secrets and variables > Actions > New repository secret"
            exit 1
          fi

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_FALY_MIRAY }}"
          projectId: "faly-miray"
          channelId: "live"
          entryPoint: "${{ steps.project.outputs.dir }}"
