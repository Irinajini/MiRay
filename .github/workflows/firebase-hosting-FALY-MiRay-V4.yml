name: Build and Deploy

on:
  push:
    branches: [ main ]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # --- INSÉREZ LE NOUVEAU BLOC ICI ---
      - name: Extract ZIP file if present
        run: |
          if [ -f "./FALY_MiRay_V6_CLIENT_ADMIN_FUNCTIONAL.zip" ]; then
            echo "✅ Fichier ZIP trouvé : ./FALY_MiRay_V6_CLIENT_ADMIN_FUNCTIONAL.zip"
            if unzip -t "./FALY_MiRay_V6_CLIENT_ADMIN_FUNCTIONAL.zip" > /dev/null 2>&1; then
              unzip -o "./FALY_MiRay_V6_CLIENT_ADMIN_FUNCTIONAL.zip" -d ./deploy_folder
              echo "📂 Extraction réussie."
            else
              echo "❌ ERREUR : Le fichier ZIP est corrompu."
              exit 1
            fi
          fi
      # -----------------------------------
      
      # Le reste de vos étapes de déploiement...
