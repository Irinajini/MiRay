name: Build & Deploy FALY MiRay V6.3

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Find and extract ZIP
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 2 -type f -iname '*.zip' -size +0c | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "::error::Aucun fichier ZIP non vide trouvé."
            exit 1
          fi

          echo "ZIP détecté : $ZIP"
          unzip -t "$ZIP"

          BUILD_DIR="$RUNNER_TEMP/faly-miray-build"
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"

          unzip -q -o "$ZIP" -d "$BUILD_DIR"

          PACKAGE_FILE="$(find "$BUILD_DIR" -maxdepth 4 -type f -name package.json | head -n 1)"

          if [ -z "$PACKAGE_FILE" ]; then
            echo "::error::package.json introuvable après extraction."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PACKAGE_FILE")"

          test -f "$PROJECT_DIR/firebase.json" || {
            echo "::error::firebase.json introuvable."
            exit 1
          }

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Projet détecté : $PROJECT_DIR"

      - name: Verify Firebase Web API key secret
        shell: bash
        env:
          API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "::error::Le secret VITE_FIREBASE_API_KEY est absent."
            echo "GitHub > Settings > Secrets and variables > Actions > New repository secret"
            exit 1
          fi

          case "$API_KEY" in
            AIza*) echo "Clé Firebase Web détectée : ${API_KEY:0:8}..." ;;
            *) echo "::error::La clé VITE_FIREBASE_API_KEY ne commence pas par AIza."; exit 1 ;;
          esac

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm install --no-audit --no-fund

      - name: Build Vite application with Firebase Web config
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: faly-miray.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: faly-miray
          VITE_FIREBASE_STORAGE_BUCKET: faly-miray.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "952480755434"
          VITE_FIREBASE_APP_ID: "1:952480755434:web:374ab34357741b45113193"
          VITE_FIREBASE_MEASUREMENT_ID: G-M5L5YXV4KJ
          VITE_CLOUDINARY_CLOUD_NAME: alfrtkxe
          VITE_CLOUDINARY_UPLOAD_PRESET: faly_miray_uploads
        run: |
          echo "VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY:0:8}..."
          npm run build

      - name: Verify build output
        shell: bash
        run: |
          test -f "${{ steps.project.outputs.dir }}/dist/index.html" || {
            echo "::error::dist/index.html introuvable."
            exit 1
          }

      - name: Prepare Firebase Admin credentials
        shell: bash
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FALY_MIRAY }}
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT_FALY_MIRAY manquant."
            exit 1
          fi

          SA_FILE="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SA" > "$SA_FILE"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$SA_FILE" >> "$GITHUB_ENV"

      - name: Deploy Firestore rules and indexes
        continue-on-error: true
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          npx firebase-tools@latest deploy \
            --only firestore:rules,firestore:indexes \
            --project faly-miray \
            --non-interactive

      - name: Deploy Firebase Hosting
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          npx firebase-tools@latest deploy \
            --only hosting \
            --project faly-miray \
            --non-interactive
