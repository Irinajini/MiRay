name: Build & Deploy FALY MiRay V6 (ZIP)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install unzip
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Locate and validate V6 ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=""

          # Priorité au nom exact du fichier V6.
          if [ -f "FALY_MiRay_V6_CLIENT_ADMIN_FUNCTIONAL.zip" ]; then
            ZIP_FILE="FALY_MiRay_V6_CLIENT_ADMIN_FUNCTIONAL.zip"
          else
            ZIP_FILE="$(find . -maxdepth 2 -type f \
              -iname '*FALY*MiRay*V6*CLIENT*ADMIN*FUNCTIONAL*.zip' \
              | head -n 1)"
          fi

          if [ -z "$ZIP_FILE" ] || [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Le ZIP FALY MiRay V6 n'a pas été trouvé dans le dépôt."
            echo "Fichiers ZIP présents :"
            find . -maxdepth 2 -type f -iname '*.zip' -print || true
            exit 1
          fi

          echo "ZIP détecté : $ZIP_FILE"
          ls -lh "$ZIP_FILE"

          # Vérifie qu'il s'agit bien d'une archive ZIP réelle et non d'un pointeur Git LFS.
          if grep -q '^version https://git-lfs.github.com/spec/v1' "$ZIP_FILE" 2>/dev/null; then
            echo "::error::Le fichier présent dans GitHub est un pointeur Git LFS, pas le ZIP lui-même."
            exit 1
          fi

          unzip -t "$ZIP_FILE"

          echo "file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract V6 project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          BUILD_DIR="$RUNNER_TEMP/faly-miray-v6"
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"

          unzip -q -o "${{ steps.zip.outputs.file }}" -d "$BUILD_DIR"

          # Le ZIP fourni contient package.json directement à sa racine.
          if [ -f "$BUILD_DIR/package.json" ]; then
            PROJECT_DIR="$BUILD_DIR"
          else
            PACKAGE_FILE="$(find "$BUILD_DIR" -maxdepth 4 -type f -name package.json \
              ! -path '*/node_modules/*' | head -n 1)"

            if [ -z "$PACKAGE_FILE" ]; then
              echo "::error::Extraction réussie mais aucun package.json n'a été trouvé."
              find "$BUILD_DIR" -maxdepth 3 -type f | sort | head -n 100
              exit 1
            fi

            PROJECT_DIR="$(dirname "$PACKAGE_FILE")"
          fi

          echo "Projet extrait dans : $PROJECT_DIR"

          test -f "$PROJECT_DIR/package.json"
          test -f "$PROJECT_DIR/firebase.json"
          test -f "$PROJECT_DIR/src/main.jsx"

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm install --no-audit --no-fund

      - name: Build Vite application
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm run build

      - name: Verify build output
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.dir }}"
          test -f "$PROJECT_DIR/dist/index.html" || {
            echo "::error::Le build n'a pas créé dist/index.html."
            exit 1
          }

      - name: Check Firebase service account secret
        shell: bash
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FALY_MIRAY }}
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "::error::Le secret FIREBASE_SERVICE_ACCOUNT_FALY_MIRAY n'est pas configuré."
            exit 1
          fi

      - name: Deploy Firestore rules and indexes
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FALY_MIRAY }}
        run: |
          set -euo pipefail
          SA_FILE="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$FIREBASE_SA" > "$SA_FILE"
          export GOOGLE_APPLICATION_CREDENTIALS="$SA_FILE"

          npx firebase-tools@latest deploy \
            --only firestore:rules,firestore:indexes \
            --project faly-miray \
            --non-interactive

      - name: Deploy Firebase Hosting site miray
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_FALY_MIRAY }}"
          projectId: "faly-miray"
          channelId: "live"
          entryPoint: "${{ steps.project.outputs.dir }}"
