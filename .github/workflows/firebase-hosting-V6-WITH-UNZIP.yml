name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Locate and extract ZIP
        shell: bash
        run: |
          set -e

          echo "Recherche des ZIP..."
          ZIP=$(find . -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "::error::Aucun ZIP trouvé."
            exit 1
          fi

          echo "ZIP trouvé : $ZIP"

          mkdir extracted
          unzip -o "$ZIP" -d extracted

          PROJECT=$(find extracted -name package.json | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "::error::package.json introuvable."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

          echo "Projet détecté : $PROJECT_DIR"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install

      - name: Build Vite application
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run build

      - name: Verify build output
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -d dist || (echo "::error::Le dossier dist est introuvable." && exit 1)

      - name: Deploy Firestore rules and indexes
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npx firebase-tools deploy \
            --only firestore \
            --project faly-miray
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-service-account.json

      - name: Deploy Firebase Hosting
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npx firebase-tools deploy \
            --only hosting \
            --project faly-miray
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-service-account.json
